<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>For My Didi</title>
<meta name="description" content="A birthday letter, written in light." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Caveat:wght@600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css?v=5" />
</head>
<body>

<!-- ambient layers, present through the whole experience -->
<canvas id="stars"></canvas>
<div class="glow-field" id="glowField" aria-hidden="true">
  <span class="glow glow-gold"></span>
  <span class="glow glow-blue"></span>
</div>
<div class="fireflies" id="fireflies" aria-hidden="true"></div>
<div id="cursor-glow" aria-hidden="true"></div>
<div id="screenFlash" class="screen-flash" aria-hidden="true"></div>

<!-- ================= PAGE 1 — THE INVITATION ================= -->
<section class="act" id="act-1" data-act="1" aria-label="Opening">
  <svg class="moon" viewBox="0 0 100 100" aria-hidden="true">
    <path d="M62 8C40 8 22 26 22 50s18 42 40 42c8 0 15.4-2.3 21.6-6.3C68 89 52 77 52 50S68 11 83.6 6.3C77.4 10.3 70 8 62 8Z" fill="url(#moonGrad)"/>
    <defs>
      <linearGradient id="moonGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f8e3ab"/>
        <stop offset="100%" stop-color="#e8c27a"/>
      </linearGradient>
    </defs>
  </svg>

  <div class="act-inner">
    <div class="heart-icon reveal" aria-hidden="true">♡</div>
    <h1 class="hero-line reveal" id="heroLine"><span id="heroTypeText"></span></h1>

    <button id="openBtn" class="open-btn reveal pulse" aria-label="Open your gift">
      <span class="open-btn-glow"></span>
      <span class="open-btn-label"><span class="spark">✨</span> Open</span>
    </button>
  </div>

  <div class="constellation-hint reveal" aria-hidden="true">
    <svg viewBox="0 0 200 60" class="thread-svg">
      <path id="threadPath" d="M10,45 C 50,10 90,55 130,20 S 190,45 190,15" />
    </svg>
  </div>

  <div class="page1-photo" aria-hidden="true">
    <div class="page1-photo-fade"></div>
    <img src="assets/images/IMG_20260123_171806.jpg" alt="" />
  </div>
  <p class="made-with-love">Made with love <span aria-hidden="true">🤍</span></p>
</section>

<!-- ================= LOADER ================= -->
<div id="loader" class="loader" aria-hidden="true">
  <div class="loader-star"></div>
  <p class="loader-text" id="loaderText">Gathering years of unspoken words&hellip;</p>
</div>

<!-- ================= PAGE 2 — THE LETTER ================= -->
<section class="act" id="act-2" data-act="2" aria-label="A letter">
  <svg class="hanging-star" viewBox="0 0 60 90" aria-hidden="true">
    <line x1="30" y1="0" x2="30" y2="34" stroke="rgba(232,194,122,0.35)" stroke-width="1"/>
    <g transform="translate(30,52)">
      <path d="M0,-16 L4.4,-5 16,-5 6.5,2 10,14 0,7 -10,14 -6.5,2 -16,-5 -4.4,-5 Z" fill="url(#starGrad)"/>
    </g>
    <defs>
      <radialGradient id="starGrad">
        <stop offset="0%" stop-color="#f8e3ab"/>
        <stop offset="100%" stop-color="#e8c27a"/>
      </radialGradient>
    </defs>
  </svg>

  <div class="envelope-stage" id="envelopeStage">
    <div class="envelope-3d" id="envelope3d">
      <span class="envelope-shadow"></span>

      <div class="letter-pullout" id="letterPullout">
        <div class="act-inner letter-inner letter-card" id="letterCard">
          <div class="letter-fold fold-1" id="fold1"></div>
          <div class="letter-fold fold-2" id="fold2"></div>
          <div class="letter-fold fold-3" id="fold3"></div>
          <div class="letter-content">
            <div class="letter-mark" aria-hidden="true">☾</div>
            <p class="type-text" id="typeText"></p>
            <p class="letter-signature" id="letterSignature">— Your Little Brother <span aria-hidden="true">❤️</span></p>
            <button id="continueBtn" class="ghost-btn is-hidden">
              <span>Continue</span>
              <span class="arrow">→</span>
            </button>
          </div>
        </div>
      </div>

      <span class="envelope-body"></span>
      <span class="envelope-flap" id="envelopeFlap">
        <span class="envelope-seal" id="envelopeSeal">
          <span class="seal-half seal-left">♥</span>
          <span class="seal-half seal-right">♥</span>
        </span>
      </span>

      <button class="envelope-tap" id="envelopeBtn" aria-label="Tap to open the letter"></button>
    </div>
    <p class="envelope-hint reveal" id="envelopeHint">Tap the envelope to open it</p>
  </div>
</section>

<!-- ================= PAGE 3 — THE GALLERY ================= -->
<section class="act" id="act-3" data-act="3" aria-label="Memories">
  <p class="gallery-heading reveal">✨ Memories ✨</p>
  <div class="gallery-stage" id="galleryStage">
    <div class="slides" id="slides">
      <!-- JS renders polaroid slides from PHOTO_DATA -->
    </div>
  </div>
  <div class="gallery-dots" id="galleryDots" aria-hidden="true"></div>
  <p class="gallery-hint">Swipe to relive memories&hellip;</p>
  <button id="toFinaleBtn" class="ghost-btn is-hidden gallery-continue">
    <span>Keep going</span>
    <span class="arrow">→</span>
  </button>
</section>

<!-- ================= PAGE 4 — THE FINALE ================= -->
<section class="act" id="act-4" data-act="4" aria-label="Happy Birthday">
  <canvas id="heartCanvas" class="heart-canvas"></canvas>
  <canvas id="confetti"></canvas>
  <div class="hearts-field" id="heartsField" aria-hidden="true"></div>
  <div class="balloon-field" id="balloonField" aria-hidden="true"></div>

  <div class="gift-stage" id="giftStage">
    <div class="gift-box-3d" id="giftBox">
      <span class="gift-glow"></span>
      <span class="gift-light-leak" id="giftLightLeak"></span>
      <span class="gift-lid" id="giftLid"></span>
      <span class="gift-ribbon-v" id="giftRibbonV"></span>
      <span class="gift-ribbon-h" id="giftRibbonH"></span>
      <span class="gift-bow" id="giftBow">🎀</span>
      <span class="gift-body"></span>
    </div>
    <p class="gift-hint reveal">Tap anywhere to open your gift</p>
    <button class="gift-tap" id="giftTap" aria-label="Tap to open your gift"></button>
  </div>

  <div class="act-inner finale-inner" id="finaleInner">
    <h1 class="finale-title" id="finaleTitle">Happy Birthday,<br><span class="didi-word">Didi</span> <span class="heart-emoji">❤️</span></h1>
    <p class="finale-sub" id="finaleSub"></p>
    <p class="thank-you-msg" id="thankYouMsg">Thank you for opening my heart, Didi. <span aria-hidden="true">❤️</span></p>
  </div>
</section>

<div class="call-bar" id="callBar">
  <a href="tel:+919263297336" id="callBtn" class="call-btn pulse-btn" aria-label="Call your little brother">
    <span class="call-btn-glow"></span>
    <span class="call-icon">📞</span>
    <span>Call Your Little Brother</span>
  </a>
</div>

<!-- ================= MUSIC CONTROL ================= -->
<audio id="bgMusic" loop preload="none">
  <source src="assets/music/after_the_longest_sunday.mp3" type="audio/mpeg" />
</audio>
<button id="musicToggle" class="music-toggle" aria-pressed="false" aria-label="Toggle background music">
  <span class="music-bars" aria-hidden="true"><i></i><i></i><i></i></span>
</button>

<script src="script.js?v=5"></script>
</body>
</html>
